apiVersion: skaffold/v4beta13
kind: Config

profiles:
  - name: dev
    build:
      local:
        push: true
      platforms:
        - linux/amd64
        - linux/arm64
      artifacts:
        - image: saturn203/simple-api
          jib:
            args:
              - -DskipTests
              - "-Djib.container.environment=SPRING_PROFILES_ACTIVE=dev"
            fromImage: eclipse-temurin:21-jre
    manifests:
      rawYaml:
        - k8s/dev/simple-api.yaml
        - k8s/dev/simple-api-ingress.yaml
    
    # portForward:
    # - resourceType: deployment
    #   resourceName: simple-api-deploy
    #   namespace: api
    #   port: 8080
    #   localPort: 9008 # *Optional* 

  - name: istio
    build:
      local:
        push: true
      platforms:
        - linux/amd64
        - linux/arm64
      artifacts:
        - image: saturn203/simple-api
          jib:
            args:
              - -DskipTests
              - "-Djib.container.environment=SPRING_PROFILES_ACTIVE=istio"
            fromImage: eclipse-temurin:21-jre
    manifests:
      rawYaml:
        - k8s/istio/*.yaml
          
  - name: kind
    build:
      local:
        push: false
      platforms:
        - linux/amd64
        - linux/arm64
      artifacts:
        - image: simple-api
          jib:
            args:
              - -DskipTests
              - "-Djib.container.environment=SPRING_PROFILES_ACTIVE=kind"
            fromImage: eclipse-temurin:21-jre
    manifests:
      rawYaml:
        - k8s/kind/simple-api.yaml 

  - name: k3d
    build:
      local:
        push: false
      platforms:
        - linux/amd64
        - linux/arm64
      artifacts:
        - image: simple-api
          jib:
            args:
              - -DskipTests
              - "-Djib.container.environment=SPRING_PROFILES_ACTIVE=k3d"
            fromImage: eclipse-temurin:21.0.3_9-jre
    manifests:
      rawYaml:
        - k8s/k3d/simple-api.yaml 
        # - k8s/k3d/simple-api-ingress.yaml 
        - k8s/k3d/simple-api-ingress-traefik.yaml 

  
